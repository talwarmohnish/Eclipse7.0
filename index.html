<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>html[data-reload-top] #root{visibility:hidden}</style>
  <script>
    (function () {
      var navigation = performance.getEntriesByType('navigation')[0];
      var reloading = navigation ? navigation.type === 'reload' : performance.navigation && performance.navigation.type === 1;
      if (!reloading) return;
      var root = document.documentElement;
      root.dataset.reloadTop = 'pending';
      root.dataset.reloadRestoration = history.scrollRestoration;
      history.scrollRestoration = 'manual';
      history.replaceState(history.state, '', location.pathname + location.search);
      window.scrollTo(0, 0);
    })();
  </script>
  <meta name="theme-color" content="#080e19"/>
  <script>(function(){var theme='dark';try{if(localStorage.getItem('eclipse-theme')==='light')theme='light';}catch(e){}document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='light'?'#f6f2e9':'#080e19');})();</script>
  <meta name="description" content="ECLIPSE 7.0 — ACM Thapar’s flagship 24-hour hackathon. 3–4 April 2027 at TIET, Patiala. Build together. Make it real."/>
  <title>ECLIPSE 7.0 — The seventh alignment</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
